[package]
name = "llmd-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/storytellerF/llmd"
rust-version = "1.90"

[lib]
name = "llmd_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
llmd-core = { path = "../../crates/llmd-core" }
llmd-rlitert = { path = "../../crates/llmd-rlitert" }
llmd-server = { path = "../../crates/llmd-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.5", features = [] }
tokio = { version = "1.42", features = ["full"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
litertlm-sys = "=0.16.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
