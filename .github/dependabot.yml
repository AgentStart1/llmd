version: 2
updates:
  - package-ecosystem: npm
    directory: "/app"
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directories:
      - "/"
      - "/app/src-tauri"
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directories:
      - "/app/src-tauri/android/llmd-android"
      - "/app/src-tauri/android/llmd-sample"
    schedule:
      interval: weekly
    groups:
      android-gradle-dependencies:
        patterns:
          - "*"
