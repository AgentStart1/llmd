version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/app/src-tauri/android/llmd-android"
    schedule:
      interval: weekly
    groups:
      android-gradle-dependencies:
        patterns:
          - "*"
