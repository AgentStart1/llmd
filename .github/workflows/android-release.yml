name: Android Release

permissions:
  contents: write

on:
  push:
    branches: ["main"]
    tags:
      - "*"

env:
  ANDROID_TARGET: "aarch64"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            app/src-tauri

      - name: Configure preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}"
          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_NDK_HOME}"
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Decode signing key
        run: |
          printf '%s' "${{ secrets.SIGNING_KEY }}" | base64 --decode > "$HOME/signing_key.jks"
          test -s "$HOME/signing_key.jks"

      - name: Build Android APK
        working-directory: app
        run: |
          npx tauri android init --ci
          ../scripts/sync-tauri-android-overrides.sh
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            npx tauri android build --apk --target "${ANDROID_TARGET}" --ci
          else
            npx tauri android build --apk --target "${ANDROID_TARGET}" --ci
            ../scripts/sync-tauri-android-overrides.sh
            ./src-tauri/gen/android/gradlew \
              --project-dir ./src-tauri/gen/android \
              :app:assembleArm64Alpha
          fi
        env:
          storyteller_f_sign_key: ${{ secrets.SIGNING_KEY }}
          storyteller_f_sign_alias: ${{ secrets.ALIAS }}
          storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
          storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Upload alpha Android APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmd-android-alpha-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/arm64/alpha/*.apk
          if-no-files-found: error

      - name: Upload release Android APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmd-android-release-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: llmd-android-release-apk
          path: release-assets

      - name: Create release when missing
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
