name: Rust Release Cache Validation

permissions:
  contents: read

on:
  push:
    branches: [ci/verify-android-release]

env:
  ANDROID_TARGET: "aarch64"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-release-v1
          workspaces: app/src-tauri -> target

      - name: Configure preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}"
          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_NDK_HOME}"
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Android APK
        working-directory: app
        run: |
          npx tauri android init --ci
          ../scripts/sync-tauri-android-overrides.sh
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            npx tauri android build --apk --target "${ANDROID_TARGET}" --ci
          else
            npx tauri android build --apk --target "${ANDROID_TARGET}" --ci
            ../scripts/sync-tauri-android-overrides.sh
            ./src-tauri/gen/android/gradlew \
              --project-dir ./src-tauri/gen/android \
              :app:assembleArm64Alpha
          fi
      - name: Upload alpha Android APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmd-android-alpha-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/arm64/alpha/*.apk
          if-no-files-found: error

      - name: Upload release Android APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llmd-android-release-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
