name: Test

on:
  workflow_dispatch:
  # Seed the same cache scopes that pull requests restore from their base branch.
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "cli/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "cli/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: host-linux-v1
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run static checks
        run: ./scripts/check-static.sh --host

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Build CLI
        run: cargo build -p llmd --locked

      - name: Test CLI end to end
        run: ./scripts/test-cli.sh

      - name: Build Linux package
        working-directory: app
        run: npm run tauri -- build --bundles deb

      - name: Verify Linux native library bundle
        run: |
          package="$(find app/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "${package}"
          dpkg-deb --contents "${package}" | grep -F 'usr/lib/llmd/liblitert-lm.so'
          readelf -d app/src-tauri/target/release/llmd-app | grep -F '$ORIGIN/../lib/llmd'

  desktop-e2e:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: host-windows-v1
          workspaces: app/src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Configure libclang
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) {
            throw "GitHub runner is missing $llvm\libclang.dll"
          }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Windows installer
        working-directory: app
        run: npm run tauri -- build --bundles nsis

      - name: Test installed desktop app
        shell: pwsh
        run: |
          $installer = Get-Item "app/src-tauri/target/release/bundle/nsis/*-setup.exe"
          ./scripts/test-desktop-package.ps1 -InstallerPath $installer.FullName

  android-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-debug-v1
          workspaces: app/src-tauri -> target

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Configure preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}"
          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_NDK_HOME}"
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Generate Tauri Android project
        working-directory: app
        run: npx tauri android init --ci

      - name: Apply Android overrides
        run: ./scripts/sync-tauri-android-overrides.sh

      - name: Build Tauri Android project
        working-directory: app
        run: npx tauri android build --apk --debug --target aarch64 --ci

      - name: Compile Android Kotlin and AIDL
        working-directory: app/src-tauri/gen/android
        run: |
          ../../../../scripts/check-static.sh --android-kotlin

      - name: Check Android Rust
        run: ./scripts/check-static.sh --android-rust
