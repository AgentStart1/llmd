name: Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "cli/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Run static checks
        run: ./scripts/check-static.sh --host

      - name: Run Rust tests
        run: cargo test --workspace --locked

  android-compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Configure preinstalled Android SDK
        run: |
          test -d "${ANDROID_HOME}"
          test -d "${ANDROID_SDK_ROOT}"
          test -d "${ANDROID_NDK_HOME}"
          echo "NDK_HOME=${ANDROID_NDK_HOME}" >> "$GITHUB_ENV"

      - name: Generate Tauri Android project
        working-directory: app
        run: npx tauri android init --ci

      - name: Apply Android overrides
        run: ./scripts/sync-tauri-android-overrides.sh

      - name: Build Tauri Android project
        working-directory: app
        run: npx tauri android build --apk --debug --target aarch64 --ci

      - name: Compile Android Kotlin and AIDL
        working-directory: app/src-tauri/gen/android
        run: |
          ../../../../scripts/check-static.sh --android-kotlin
